    :root {
      color-scheme: light;
      --page: #ffffff;
      --ink: #171717;
      --muted: #666660;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--page);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      cursor: default;
    }

    main {
      width: min(100%, 1040px);
      max-height: 100%;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "C059", Georgia, serif;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 400;
      line-height: .96;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .description {
      max-width: 610px;
      margin: clamp(24px, 3.5vw, 38px) auto 0;
      color: var(--muted);
      font-family: "C059", Georgia, serif;
      font-size: clamp(.9rem, 1.25vw, 1.05rem);
      font-weight: 400;
      line-height: 1.85;
      letter-spacing: -.035em;
    }

    .launch {
      display: inline-flex;
      min-width: 96px;
      min-height: 32px;
      align-items: center;
      justify-content: center;
      margin-top: clamp(30px, 4.5vw, 48px);
      padding: 0 17.333333px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #171717;
      font-family: "C059", Georgia, serif;
      font-size: .92rem;
      font-weight: 400;
      letter-spacing: 0;
      text-decoration: none;
      cursor: pointer;
    }

    .launch:hover {
      background: #e5e5e5;
      font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace;
    }

    .launch:focus-visible {
      outline: none;
    }

    @media (max-width: 520px) {
      body { padding-inline: 20px; }
    }

    @media (max-height: 560px) {
      .description { margin-top: 18px; line-height: 1.5; }
      .launch { margin-top: 22px; min-height: 28px; }
    }
